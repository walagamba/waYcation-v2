</head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen selection:bg-signal-red selection:text-stark-white"><header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl pt-safe"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface hover:text-signal-red transition-colors active:scale-95" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><div class="flex flex-col"><div class="flex items-center gap-2"><h1 class="font-headline-sm text-[18px] font-semibold tracking-tight text-stark-white">Ella &amp; Galle Trip</h1><span class="w-2 h-2 rounded-full bg-signal-red animate-pulse"></span></div><span class="font-label-sm text-label-sm text-telemetry-gray">2 of 3 voted</span></div></div><div class="flex items-center -space-x-2"><div class="w-8 h-8 rounded-full border border-surface bg-surface-container flex items-center justify-center text-xs font-semibold text-stark-white">K</div><div class="w-8 h-8 rounded-full border border-surface bg-surface-container-high flex items-center justify-center text-xs font-semibold text-stark-white">A</div><div class="w-8 h-8 rounded-full border border-surface bg-signal-red/20 text-signal-red flex items-center justify-center text-xs font-semibold">D</div></div></div></header><main class="flex flex-col justify-between flex-1 relative w-full pt-20 pb-safe bg-surface min-h-screen px-gutter max-w-[430px] mx-auto">
<!-- Tinder Decision Stage -->
<div class="flex-1 flex flex-col justify-center items-center w-full py-2" id="voting-stage">
<!-- Main Minimal Card Node -->
<div class="w-full relative bg-surface-container-lowest rounded-2xl overflow-hidden transition-transform duration-150 shadow-2xl flex flex-col cursor-grab active:cursor-grabbing border border-border-subtle" id="swipe-card">
<!-- Photo Container -->
<div class="relative w-full h-[370px] overflow-hidden bg-surface-container-high">
<img class="w-full h-full object-cover filter grayscale contrast-125 transition-all duration-500 hover:filter-none" data-alt="Monochrome architectural photograph of The Fortress Resort and Spa in Galle Sri Lanka, ocean tides crashing in deep contrast, dusk lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2bcNSPKiTQh_eCsEGis6L_9BWRb7K3c-H-GMF7_w_6p6xHOjCNRii7QVF0IByK1OMtmL3f5Kw9TRx4n-Yxtg8wqiR4hcGOQuIcb_AzCR4mJ1elgyqDhYUjC172QxuUgpjP4c1Akwkj-DgeBNrokcLExesc5Om5w4jstjp0PSF9t2tZSJLzZmXTD73dLmTD7WPJOwzEO3QgUDwMrrNlRIz_2loVXYBGnuPsaTzfowSergEmP2fomlPxA"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-black/30"></div>
<!-- Top Pill Indicator -->
<div class="absolute top-3.5 left-3.5">
<span class="bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium text-stark-white/90">Galle Fort</span>
</div>
<!-- Dynamic Swipe Feedback Overlays -->
<div class="absolute top-1/2 left-6 -translate-y-1/2 px-4 py-2 bg-signal-red text-stark-white font-headline-sm text-sm uppercase tracking-widest opacity-0 transform -rotate-12 transition-opacity pointer-events-none rounded-DEFAULT font-bold" id="pass-stamp">
          PASS
        </div>
<div class="absolute top-1/2 right-6 -translate-y-1/2 px-4 py-2 bg-stark-white text-pure-black font-headline-sm text-sm uppercase tracking-widest opacity-0 transform rotate-12 transition-opacity pointer-events-none rounded-DEFAULT font-bold" id="endorse-stamp">
          ENDORSE
        </div>
</div>
<!-- Candidate Details -->
<div class="p-space-md flex flex-col gap-2.5 bg-surface-container-lowest">
<div class="flex items-start justify-between gap-2">
<div>
<h2 class="font-headline-sm text-[22px] font-semibold text-stark-white tracking-tight leading-tight">The Fortress Resort &amp; Spa</h2>
<p class="text-body-sm text-telemetry-gray mt-0.5">Galle, Sri Lanka</p>
</div>
<div class="text-right flex flex-col items-end">
<span class="font-label-lg text-[17px] font-bold text-stark-white tabular-nums tracking-normal">LKR 45,000</span>
<span class="text-[11px] text-telemetry-gray">per night</span>
</div>
</div>
<div class="flex items-center justify-between pt-1 border-t border-border-subtle/60 text-body-sm text-telemetry-gray">
<div class="flex items-center gap-1.5 text-stark-white">
<span class="material-symbols-outlined text-[16px] text-signal-red" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-medium text-sm">4.9</span>
<span class="text-xs text-telemetry-gray">(142 reviews)</span>
</div>
<div class="flex items-center gap-1 text-xs text-telemetry-gray">
<span class="material-symbols-outlined text-[14px]">location_on</span>
<span>1.2 km from center</span>
</div>
</div>
</div>
</div>
</div>
<!-- Tactile Action Buttons (Nothing OS Hardware Archetype) -->
<div class="w-full flex items-center justify-center gap-10 my-4">
<!-- Pass Action Button -->
<button aria-label="Pass Candidate" class="w-16 h-16 rounded-full bg-surface-container-low border border-border-subtle flex items-center justify-center text-on-surface transition-all duration-150 active:scale-90 hover:bg-surface-container hover:text-signal-red shadow-lg" id="btn-pass">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
<!-- Endorse Action Button -->
<button aria-label="Endorse Candidate" class="w-16 h-16 rounded-full bg-stark-white text-pure-black flex items-center justify-center transition-all duration-150 active:scale-90 hover:bg-signal-red hover:text-stark-white shadow-xl" id="btn-endorse">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
</div>
<!-- Deck Status / Pagination -->
<div class="w-full pb-4 pt-1 flex flex-col items-center justify-center gap-2">
<div class="flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-telemetry-gray/40"></span>
<span class="w-5 h-1.5 rounded-full bg-stark-white"></span>
<span class="w-1.5 h-1.5 rounded-full bg-telemetry-gray/40"></span>
<span class="w-1.5 h-1.5 rounded-full bg-telemetry-gray/40"></span>
</div>
<span class="font-label-sm text-[11px] text-telemetry-gray tracking-wider">2 of 4</span>
</div>
<!-- Interactive Swipe Script -->
<script>
    (function() {
      const card = document.getElementById('swipe-card');
      const passStamp = document.getElementById('pass-stamp');
      const endorseStamp = document.getElementById('endorse-stamp');
      const btnPass = document.getElementById('btn-pass');
      const btnEndorse = document.getElementById('btn-endorse');

      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      function updateCardTransform(xOffset) {
        const rotation = xOffset * 0.07;
        card.style.transform = `translateX(${xOffset}px) rotate(${rotation}deg)`;

        if (xOffset < -20) {
          passStamp.style.opacity = Math.min(Math.abs(xOffset) / 90, 1);
          endorseStamp.style.opacity = 0;
        } else if (xOffset > 20) {
          endorseStamp.style.opacity = Math.min(xOffset / 90, 1);
          passStamp.style.opacity = 0;
        } else {
          passStamp.style.opacity = 0;
          endorseStamp.style.opacity = 0;
        }
      }

      function resetCard() {
        card.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
        card.style.transform = 'translateX(0px) rotate(0deg)';
        passStamp.style.opacity = 0;
        endorseStamp.style.opacity = 0;
        setTimeout(() => {
          card.style.transition = 'transform 0.15s ease-out';
        }, 300);
      }

      function triggerAction(action) {
        card.style.transition = 'transform 0.35s ease-in, opacity 0.3s';
        if (action === 'pass') {
          passStamp.style.opacity = 1;
          card.style.transform = 'translateX(-120vw) rotate(-20deg)';
        } else {
          endorseStamp.style.opacity = 1;
          card.style.transform = 'translateX(120vw) rotate(20deg)';
        }
        card.style.opacity = 0;

        setTimeout(() => {
          card.style.transition = 'none';
          card.style.transform = 'translateX(0px) scale(0.96)';
          passStamp.style.opacity = 0;
          endorseStamp.style.opacity = 0;
          
          setTimeout(() => {
            card.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease-out';
            card.style.transform = 'translateX(0px) scale(1)';
            card.style.opacity = 1;
          }, 40);
        }, 360);
      }

      card.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.clientX;
        card.style.transition = 'none';
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        currentX = e.clientX - startX;
        updateCardTransform(currentX);
      });

      window.addEventListener('pointerup', () => {
        if (!isDragging) return;
        isDragging = false;
        if (currentX < -100) {
          triggerAction('pass');
        } else if (currentX > 100) {
          triggerAction('endorse');
        } else {
          resetCard();
        }
        currentX = 0;
      });

      btnPass.addEventListener('click', () => triggerAction('pass'));
      btnEndorse.addEventListener('click', () => triggerAction('endorse'));
    })();
  </script>
</main></body></html>
