<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Account | waYcation 2.0')}"></head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-200 p-8"
         th:with="currentRole=${selectedRole != null ? selectedRole : 'TOURIST'}">

        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Create Your waYcation Account</h1>
            <p class="text-sm text-slate-600 mt-1">Choose your account type to start exploring or hosting in Sarawak.</p>
        </div>

        <div th:if="${errorMessage}" class="mb-5 p-3.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm"
             th:text="${errorMessage}"></div>

        <form th:action="@{/auth/sign-up}" method="post" class="space-y-5">
            <!-- Role Selector Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <label class="cursor-pointer border rounded-xl p-4 flex flex-col justify-between transition hover:border-slate-900"
                       th:classappend="${currentRole == 'TOURIST' ? 'border-slate-900 bg-slate-50 ring-2 ring-slate-900' : 'border-slate-200'}">
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-sm text-slate-900">Tourist</span>
                        <input type="radio" name="role" value="TOURIST"
                               th:checked="${currentRole == 'TOURIST'}"
                               class="text-slate-900 focus:ring-slate-900" />
                    </div>
                    <p class="text-xs text-slate-600 mt-2">Plan trips, book stays, and explore Sarawak attractions.</p>
                </label>

                <label class="cursor-pointer border rounded-xl p-4 flex flex-col justify-between transition hover:border-indigo-700"
                       th:classappend="${currentRole == 'HOTEL_OWNER' ? 'border-indigo-700 bg-indigo-50/40 ring-2 ring-indigo-700' : 'border-slate-200'}">
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-sm text-indigo-950">Hotel Owner</span>
                        <input type="radio" name="role" value="HOTEL_OWNER"
                               th:checked="${currentRole == 'HOTEL_OWNER'}"
                               class="text-indigo-700 focus:ring-indigo-700" />
                    </div>
                    <p class="text-xs text-slate-600 mt-2">List properties, manage room inventory, and accept bookings.</p>
                </label>
            </div>

            <div>
                <label for="displayName" class="block text-sm font-medium text-slate-700 mb-1">Full Name or Business Name</label>
                <input id="displayName" name="displayName" type="text" required minlength="2"
                       placeholder="Aisha Lim"
                       class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600" />
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input id="email" name="email" type="email" required autocomplete="email"
                       placeholder="you@example.com"
                       class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600" />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password (minimum 6 characters)</label>
                <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password"
                       placeholder="••••••••"
                       class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600" />
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 rounded-lg bg-indigo-700 hover:bg-indigo-800 text-white font-semibold text-sm shadow transition">
                Create Account
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-200 text-center text-sm text-slate-600">
            Already have an account?
            <a th:href="@{/tourist/sign-in}" class="font-semibold text-indigo-600 hover:text-indigo-800">Sign in here</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
