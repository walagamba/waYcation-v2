# ==========================================================================
# waYcation 2.0 — Spring Boot Application Configuration
# Stack: Java 21 + Spring Boot 3.4.3 + Spring Data JPA + PostgreSQL + Thymeleaf
# ==========================================================================
spring.application.name=waycation-2.0
server.port=${PORT:8085}

# PostgreSQL Relational Database Configuration (Supabase Pooler / Local PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.jfikjhumkrbpjzhprszx}
spring.datasource.password=${DB_PASSWORD:waYcation@WD46}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate ORM Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Schema & Seed Data Initialization (schema.sql + data.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Multipart File Upload Settings (Accommodation Featured & Gallery Photos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Thymeleaf HTML5 Server-Side Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
