server.port=8082

# Local Development Profile with In-Memory H2 Database (PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:waycation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SQL Schema & Seed Data Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
